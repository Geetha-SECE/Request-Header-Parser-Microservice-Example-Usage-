<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timestamp Microservice</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 { color: #333; }
    .example {
      background: #f5f5f5;
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 4px;
      font-family: monospace;
    }
    .example a { color: #0066cc; text-decoration: none; }
    .example a:hover { text-decoration: underline; }
    pre { background: #f5f5f5; padding: 1rem; border-radius: 4px; overflow-x: auto; }
    code { font-family: monospace; }
  </style>
</head>
<body>
  <h1>Timestamp Microservice</h1>
  <p>Example usage:</p>
  <div class="example">
    <a href="/api/2015-12-25">/api/2015-12-25</a>
  </div>
  <div class="example">
    <a href="/api/1451001600000">/api/1451001600000</a>
  </div>
  <div class="example">
    <a href="/api">/api (current time)</a>
  </div>
  <p>Example output:</p>
  <pre><code>{
  "unix": 1451001600000,
  "utc": "Fri, 25 Dec 2015 00:00:00 GMT"
}</code></pre>
</body>
</html>
