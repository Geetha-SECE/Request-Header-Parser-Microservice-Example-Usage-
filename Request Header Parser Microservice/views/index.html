<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Header Parser Microservice</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 { color: #333; }
    .example {
      background: #f5f5f5;
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 4px;
      font-family: monospace;
    }
    .example a { color: #0066cc; text-decoration: none; }
    .example a:hover { text-decoration: underline; }
    pre { background: #f5f5f5; padding: 1rem; border-radius: 4px; overflow-x: auto; }

<body>

  <div class="example">
    <a href="/api/whoami">/api/whoami</a>

  <p>Example output:</p>
  <pre><code>{
  "ipaddress": "159.20.14.100",
  "language": "en-US,en;q=0.9",
  "software": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

</html>
